name: lab4-sms-spam
services:
  api:
    image: sms-spam:${MODEL_RELEASE:-v1}
    build:
      context: .
      args:
        MODEL_RELEASE: ${MODEL_RELEASE:-v1}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
